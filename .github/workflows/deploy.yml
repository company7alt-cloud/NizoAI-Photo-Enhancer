name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: 171.22.135.241
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: /root/deploy.sh
