name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 46.225.169.83
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: /root/deploy.sh
